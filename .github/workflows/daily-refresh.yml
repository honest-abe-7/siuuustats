# Daily source refresh + new-match detection. Opens (or updates) ONE pull request for a human
# to review. It never merges, never pushes to main and never deploys: deploy.yml only runs
# after a human merges the PR.
#
# Also carries a weekly keepalive job: GitHub disables scheduled workflows in public repos after
# 60 days without repository activity; re-enabling via the REST API resets that timer without
# any commit (same approach as liskin/gh-workflow-keepalive, inlined so there is no extra dependency).
name: Daily refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC (off the hour to avoid the top-of-hour rush)
    - cron: "41 7 * * 1" # weekly (Monday 07:41 UTC): keepalive only
  workflow_dispatch:
    inputs:
      offline_detect:
        description: "Skip TheSportsDB (use only the martj42 snapshot for detection)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh snapshots and open a review PR
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the automation branch (never main)
      pull-requests: write # open/update the review PR
      issues: write # report fetch failures
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Refresh source snapshots (fail-safe; keeps old files on any error)
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }} # only for the martj42 commit-sha lookup (rate limits)
        run: node pipeline/refresh-snapshots.mjs

      - name: Detect new Al-Nassr / Portugal matches
        id: detect
        env:
          OFFLINE: ${{ inputs.offline_detect }}
        run: |
          if [ "$OFFLINE" = "true" ]; then
            node pipeline/detect-matches.mjs --offline
          else
            node pipeline/detect-matches.mjs
          fi

      - name: Rebuild international ledger from new snapshots
        id: ingest
        if: steps.refresh.outputs.data_raw_changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run ingest:intl 2>&1 | tee reports/pipeline/ingest.log

      - name: npm run check
        id: check
        if: steps.refresh.outputs.data_raw_changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee reports/pipeline/check.log

      - name: Compose PR body
        env:
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node pipeline/pr-body.mjs > /dev/null
          cat reports/pipeline/pr-body.md >> "$GITHUB_STEP_SUMMARY"

      # Opens or updates a single PR from branch automation/daily-refresh. No auto-merge is
      # configured anywhere; a maintainer must review and merge. If nothing changed, no PR.
      - name: Open / update review pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Optional: a fine-grained PAT stored as PIPELINE_PR_TOKEN makes CI run on the PR.
          # With the default GITHUB_TOKEN, GitHub does not trigger other workflows for the PR.
          token: ${{ secrets.PIPELINE_PR_TOKEN || github.token }}
          branch: automation/daily-refresh
          delete-branch: true
          commit-message: "data: daily source refresh (automated, needs review)"
          title: "Daily source refresh: review before merging"
          body-path: reports/pipeline/pr-body.md
          labels: automated, needs-review
          add-paths: |
            data/raw/**
            data/matches.csv
            data/goals.csv
            data/teams.csv
            pipeline/snapshots/**
          sign-commits: true

      - name: Report fetch failures in an issue (one open issue, updated)
        if: steps.refresh.outputs.errors != '0' || steps.detect.outputs.detect_errors != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Daily refresh: source fetch errors"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file reports/pipeline/pr-body.md
          else
            gh issue create --title "$title" --body-file reports/pipeline/pr-body.md
          fi
          echo "::warning::Some sources failed; old snapshots were kept. See the issue and the job summary."

  keepalive:
    name: Keep the schedule enabled
    if: github.event.schedule == '41 7 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # PUT /actions/workflows/{id}/enable
    steps:
      - name: Re-enable this workflow (resets the 60-day inactivity timer; no commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-refresh.yml/enable"
