# Deploy: on every push to main, build the site and upload dist/ to the Cloudflare Pages
# project "siuuustats" (free plan). Requires two repository secrets (see pipeline/README.md):
#   CLOUDFLARE_API_TOKEN   API token with only "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
# Nothing here creates the project or the secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Never run two deploys at once; never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://siuuustats.pages.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Same gate as CI: never publish data that fails validation/reconciliation.
      - name: npm run check (also builds dist/api/v1)
        run: npm run check

      # The web workstream adds a "build" script that writes the site into dist/ (CONTRACTS §8).
      - name: Build site (if a build script exists)
        run: npm run build --if-present

      - name: Verify dist/
        run: |
          test -d dist && test -n "$(ls -A dist)"
          find dist -type f | sort | head -50

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=siuuustats --branch=main --commit-dirty=true
